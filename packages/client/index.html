<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marxopoly — online property trading</title>
    <meta name="description" content="A real-time multiplayer property trading board game you can play in the browser with friends." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1420'/%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='none' stroke='%2354d98c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2354d98c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <script>
      // Set the theme before first paint so light-mode users see no dark flash.
      try {
        var t = localStorage.getItem('marxopoly.theme.v1');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
